# TEMPORARY INVESTIGATION WORKFLOW — not part of the product's CI.
#
# v1.4: why does `candidateIdentity()` return resolved:false ONLY on GitHub
# Actions Windows? This runs the same probe on windows-latest and ubuntu-latest
# so the two hosts can be compared inside ONE run. It is deleted once the
# question is answered; it deliberately does not touch the real workflows.
name: canary-identity-diag

on:
  push:
    branches: [codex/v14-last-known-gaps]

permissions:
  contents: read

jobs:
  diag:
    name: identity diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.3.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: which git does the HOST have (ground truth about the runner image)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Write-Output "--- where.exe git ---"
          where.exe git
          Write-Output "--- candidate paths the PRODUCT will look at ---"
          foreach ($p in @(
            'C:\Program Files\Git\cmd\git.exe',
            'C:\Program Files (x86)\Git\cmd\git.exe',
            'C:\Windows\System32\git.exe',
            'C:\Program Files\nodejs\git.exe',
            'C:\Program Files\Git\bin\git.exe',
            'C:\Program Files\Git\mingw64\bin\git.exe')) {
            "{0,-52} {1}" -f $p, (Test-Path $p)
          }
          Write-Output "--- 8.3 short name of the temp dir? ---"
          Write-Output ("TEMP env      = " + $env:TEMP)
          Write-Output ("RUNNER_TEMP   = " + $env:RUNNER_TEMP)
      - name: the product's own answer
        run: node tooling/probes/v14-windows-identity-diag.mjs
