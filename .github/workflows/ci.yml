name: canary-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: the golden proof must keep holding

jobs:
  core:
    name: build + unit/integration tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --test "packages/**/dist/test/*.test.js" "apps/**/dist/test/*.test.js"

  golden-proof:
    name: golden regression proof (axios 0.27.2 -> 1.0.0)
    needs: core
    runs-on: windows-latest   # fixture proven on Windows; ubuntu parity TBD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Audit F11: CI must run the REAL proof assertions, not just `run`'s exit
      # code. `check` re-asserts the committed expectation against the just-run
      # evidence WITHOUT a second full run. Only the two normalized-hash
      # assertions are host-gated (proofHost fingerprint match, audit F11); on a
      # CI runner they report SKIPPED while classification/rule/drift/
      # attestation/pinning/exit-codes/within-arm-determinism/summaries/
      # failing-identities are all asserted and a divergence fails the job.
      - name: canary run (execute the axios 0.27.2 -> 1.0.0 experiment)
        run: node apps/cli/dist/src/main.js run fixtures/axios-0.27-to-1.0/specs/axios-mock-adapter.json
        shell: bash
      - name: canary check (assert the committed proof, not just the exit code)
        run: node apps/cli/dist/src/main.js check fixtures/axios-0.27-to-1.0/specs/axios-mock-adapter.json
        shell: bash
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle
          path: .canary-runs/**/artifacts/
