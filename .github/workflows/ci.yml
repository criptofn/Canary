name: canary-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: the golden proof must keep holding

# Superseded pull-request runs are wasted work; main/tag runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: build + unit/integration tests (offline)
    strategy:
      # Both OS legs must report. With the default (fail-fast: true) an Ubuntu
      # failure CANCELS the Windows leg, so a Windows-only break was invisible
      # in exactly the runs where it mattered.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # MEASURED (v1.4). These are not the same job on the two hosts, so they do not get the
    # same budget.
    #
    # Ubuntu: the whole suite finishes in ~80 s.
    #
    # Windows (GitHub-hosted runner): the SAME commit, the same command, the same Node — and
    # a handful of `panel K` / attested-channel tests that drive the real pipeline stall
    # instead of running. Measured profile from run 35513360741 (job 106085049619, cancelled
    # at the old 30-minute cap): individual tests took 92,698 ms / 92,908 ms / 98,124 ms /
    # 335,197 ms / 335,763 ms / 337,352 ms / 1,441,173 ms, against 115 ms - 2,213 ms for the
    # same tests in this repository's recorded logs on a developer Windows machine and 1.2 s
    # on the ubuntu leg of the same run. That is a stall, not slowness: the leg needed more
    # than 50 minutes of test time, and three of those tests reported `not ok` after stalling.
    #
    # CLASSIFIED: HOST LIMITATION (GitHub-hosted Windows runner) — not a product defect and not
    # a test defect; the assertions are correct and pass on a real Windows host. The old
    # 30-minute cap turned this into `cancelled`, an ambiguous status that hid both the profile
    # and the verdict. The budget below is the measured need plus headroom, so the leg now RUNS
    # TO COMPLETION and reports a named, deterministic result. Nothing is skipped, no assertion
    # is relaxed, and a genuine Windows regression still fails this job.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 30 }}
    steps:
      # Actions are pinned by commit SHA (supply chain). Dependabot
      # (.github/dependabot.yml) is what keeps these pins current — do not
      # hand-edit a SHA to a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund   # audit S3: reproducible, lockfile-exact install
      - run: npm run build
      - run: node --test "packages/**/dist/test/*.test.js" "apps/**/dist/test/*.test.js"
      - run: node tooling/probes/architecture-closure.mjs
      - run: node tooling/probes/architecture-metrics.mjs
      - run: node tooling/probes/cleanroom-packed-artifact.mjs
      - run: node tooling/probes/packed-architecture.mjs
      - if: runner.os == 'Linux'
        run: node tooling/probes/architecture-closure-mutations.mjs

  standalone:
    name: standalone single executable (build AND execute, per host)
    # A single-executable build embeds the RUNNING node binary, so each target
    # must be built and executed on its own host — there is no cross-build. This
    # job is the real build path for linux-x64, darwin-arm64 and win32-x64, and
    # the builder refuses to report success without EXECUTING the artifact with
    # every Node directory removed from PATH.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # MEASURED (v1.4): this job pinned `22` and failed on all three legs for
          # two releases with `FAIL: node --build-sea failed (status 9)` and no
          # other detail. `--build-sea` is documented as "Added in: v25.5.0"
          # (nodejs.org/api/single-executable-applications.html, History table);
          # on Node 22 node rejects the unknown option, prints nothing and exits 9.
          # So the job was asking an incapable runtime to produce the artifact and
          # then reporting the artifact as broken. 26.3.0 is the version this
          # workflow's golden-proof job already runs.
          node-version: 26.3.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: build + EXECUTE the standalone (refuses to claim an unexecuted artifact)
        run: npm run standalone
      - name: the target list is honest about what this host can produce
        run: node tooling/standalone.mjs --list-targets
      - name: upload the executable and its evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-${{ matrix.os }}
          path: |
            pack/standalone/**
          if-no-files-found: warn

  golden-proof:
    name: golden regression proof (axios 0.27.2 -> 1.0.0) — DESIGNATED PROOF HOST
    # Deliberately INDEPENDENT of `core`. This job is the committed proof host and
    # the flagship evidence claim; while it was gated behind the matrix it
    # returned `skipped` on every run whose Ubuntu leg failed — i.e. the proof
    # went unexecuted while the workflow still reported a verdict. A proof that
    # can be silently skipped is not a proof. It now runs on every push, every
    # tag and every weekly schedule, and reports its own verdict.
    runs-on: windows-latest   # fixture proven on Windows; ubuntu parity TBD
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Round-3 B3: this job IS the committed proof host (win32/x64/
      # node 26.3.0/npm 11.16.0 + the nodeExecSha256 exec-bytes pin, independent-audit
      # F2, per the proof file's proofHost block — setup-node installs the
      # official nodejs.org binary whose bytes the digest was cut from).
      # EXACT pins — not "26": host-exactness is decided by the ACTUAL
      # runtime's bytes, so a drifted node/npm here (or a repackaged
      # runtime printing 26.3.0) makes `check` correctly report INCOMPLETE
      # (exit 2) and fail the job. If the pins move, the proof file's
      # proofHost/environment blocks must be re-cut on a machine that
      # genuinely runs the new versions.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.3.0
      - run: npm install -g npm@11.16.0   # exact npm pin: the proof host identity includes npm
      - run: npm ci --no-audit --no-fund   # audit S3
      - run: npm run build
      # Audit F11 + round-3 B3: `check` re-asserts the committed expectation
      # against the just-run evidence WITHOUT a second full run. On this
      # pinned host EVERY assertion — including the normalized-hash pairs and
      # the evidence-environment binding — is evaluated; a SKIPPED host-exact
      # assertion (or a divergence) exits non-zero and fails the job. On any
      # other machine `check` reports INCOMPLETE (exit 2) by design.
      - name: canary run (execute the axios 0.27.2 -> 1.0.0 experiment)
        run: node apps/cli/dist/src/main.js run fixtures/axios-0.27-to-1.0/specs/axios-mock-adapter.json
        shell: bash
      - name: canary check (assert the committed proof, not just the exit code)
        run: node apps/cli/dist/src/main.js check fixtures/axios-0.27-to-1.0/specs/axios-mock-adapter.json
        shell: bash
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-bundle
          path: .canary-runs/**/artifacts/
